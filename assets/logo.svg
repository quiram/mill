<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="mill logo: a windmill grinding grain">
  <!-- sky glow -->
  <circle cx="128" cy="100" r="104" fill="#F6EBD0"/>

  <!-- ground -->
  <path d="M20 228 H236" stroke="#8C5A2B" stroke-width="6" stroke-linecap="round"/>

  <!-- tower -->
  <path d="M92 228 L108 112 H148 L164 228 Z" fill="#D9A05B" stroke="#8C5A2B" stroke-width="6" stroke-linejoin="round"/>
  <g stroke="#B97E3F" stroke-width="3" stroke-linecap="round">
    <line x1="99" y1="176" x2="157" y2="176"/>
    <line x1="104" y1="144" x2="152" y2="144"/>
    <line x1="95" y1="206" x2="161" y2="206"/>
  </g>

  <!-- door -->
  <path d="M116 228 V204 a12 12 0 0 1 24 0 V228 Z" fill="#8C5A2B"/>

  <!-- cap -->
  <path d="M98 114 L128 76 L158 114 Z" fill="#A5761F" stroke="#8C5A2B" stroke-width="6" stroke-linejoin="round"/>

  <!-- sails -->
  <g stroke="#8C5A2B" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
    <g transform="translate(128 96) rotate(20)">
      <line x1="0" y1="0" x2="0" y2="-78"/>
      <rect x="3" y="-74" width="22" height="50" fill="#FBF4E2"/>
      <line x1="3" y1="-49" x2="25" y2="-49" stroke-width="3"/>
    </g>
    <g transform="translate(128 96) rotate(110)">
      <line x1="0" y1="0" x2="0" y2="-78"/>
      <rect x="3" y="-74" width="22" height="50" fill="#FBF4E2"/>
      <line x1="3" y1="-49" x2="25" y2="-49" stroke-width="3"/>
    </g>
    <g transform="translate(128 96) rotate(200)">
      <line x1="0" y1="0" x2="0" y2="-78"/>
      <rect x="3" y="-74" width="22" height="50" fill="#FBF4E2"/>
      <line x1="3" y1="-49" x2="25" y2="-49" stroke-width="3"/>
    </g>
    <g transform="translate(128 96) rotate(290)">
      <line x1="0" y1="0" x2="0" y2="-78"/>
      <rect x="3" y="-74" width="22" height="50" fill="#FBF4E2"/>
      <line x1="3" y1="-49" x2="25" y2="-49" stroke-width="3"/>
    </g>
  </g>

  <!-- hub -->
  <circle cx="128" cy="96" r="8" fill="#E8B84B" stroke="#8C5A2B" stroke-width="4"/>

  <!-- flour at the foot -->
  <ellipse cx="178" cy="224" rx="16" ry="5" fill="#FBF4E2" stroke="#C9C2AE" stroke-width="2"/>
  <g fill="#E8B84B" stroke="#A5761F" stroke-width="1.5">
    <ellipse cx="60" cy="222" rx="3" ry="5" transform="rotate(-20 60 222)"/>
    <ellipse cx="72" cy="224" rx="3" ry="5" transform="rotate(15 72 224)"/>
    <ellipse cx="50" cy="225" rx="3" ry="5" transform="rotate(5 50 225)"/>
  </g>
</svg>
